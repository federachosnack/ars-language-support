name: Publish to VS Code Marketplace

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get OIDC Token and Publish
        run: |
          OIDC_RESPONSE=$(curl -sLS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange")
          OIDC_TOKEN=$(echo "$OIDC_RESPONSE" | node -pe "JSON.parse(fs.readFileSync(0, 'utf8')).value")
          npx @vscode/vsce publish --pat "$OIDC_TOKEN" --no-dependencies
